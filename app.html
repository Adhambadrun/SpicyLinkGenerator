<style>
/* ============================================================
   Spicy Link Generator — SpicyTerminal house style
   Same identity as SpicyTerminal: a black terminal window, one
   monospace voice, hairline pane frames, terminal-green output,
   red for the one action that matters. Type is uppercase and
   letter-spaced where SpicyTerminal's pane labels are, buttons
   are flat 4px-radius slabs, and nothing animates: a value
   changes, it does not slide in. The wordmark keeps the house
   red ("Spicy" red, "LINK GENERATOR" white) over these tokens.
   ============================================================ */
:root{--bg:#05080b;--pane:#0a0f14;--line:#17222b;--dim:#546a77;--green:#53d977;
--green2:#1f9d55;--red:#e2574b;--out:#51e07c;--amber:#f0a35c;--blue:#6aaad4;
--ink:#c9d8ce;--ink-bright:#dbe7de;
--mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,Menlo,monospace;
--pad-x:clamp(10px,2.2vw,22px);--pad-y:clamp(6px,1.2vh,12px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;height:100dvh;width:100%;max-width:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);display:flex;flex-direction:column;
min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- masthead: wordmark left, byline right (SpicyTerminal header) ---------- */
header{padding:var(--pad-y) var(--pad-x) 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
header img{height:clamp(20px,3vh,26px);width:auto;max-width:min(60vw,420px);display:block;object-fit:contain}
header .credit{color:#5b6e77;font-size:clamp(10px,1.6vw,11px);flex:none}

/* ---------- the one scrolling region ---------- */
main{flex:1 1 0%;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
padding:2px var(--pad-x) 8px;scrollbar-width:thin;scrollbar-color:rgba(81,224,124,.34) transparent}
main::-webkit-scrollbar{width:8px;height:8px}
main::-webkit-scrollbar-track{background:rgba(7,12,16,.72)}
main::-webkit-scrollbar-thumb{background:rgba(81,224,124,.3);border:2px solid #05080b;border-radius:8px}
main::-webkit-scrollbar-thumb:hover{background:rgba(81,224,124,.62)}
.wrap{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,14px)}

/* ---------- panes: a static hairline marks the top of each window ---------- */
.pane{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--pane);
display:flex;flex-direction:column;min-height:0;min-width:0}
.pane::before{content:"";position:absolute;inset:0 0 auto;height:2px;border-radius:6px 6px 0 0;pointer-events:none;z-index:2;
background:linear-gradient(90deg,transparent,rgba(106,170,212,.08) 28%,rgba(106,170,212,.45) 50%,rgba(106,170,212,.1) 72%,transparent)}
.pane.out::before{background:linear-gradient(90deg,transparent,rgba(83,217,119,.08) 28%,rgba(83,217,119,.5) 50%,rgba(226,87,75,.2) 72%,transparent)}
.pane .step{font-size:10px;letter-spacing:2px;color:#7f95a0;font-weight:700;flex:none;text-transform:uppercase;
padding:9px 14px 7px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pane.out .step{color:var(--green)}
.pane-body{padding:0 14px 12px;min-width:0}

/* ---------- input window ---------- */
textarea{width:100%;background:transparent;border:0;outline:0;resize:vertical;font-family:var(--mono);
font-size:13.5px;line-height:1.55;padding:2px 14px 12px;white-space:pre-wrap;overflow:auto;color:var(--ink-bright);
min-height:150px;max-height:46vh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
scrollbar-width:thin;scrollbar-color:rgba(81,224,124,.42) transparent}
textarea::placeholder{color:#3d4f57}
textarea::-webkit-scrollbar{width:8px;height:8px}
textarea::-webkit-scrollbar-track{background:rgba(7,12,16,.72)}
textarea::-webkit-scrollbar-thumb{background:rgba(81,224,124,.34);border:2px solid #0a0f14;border-radius:8px}
textarea::-webkit-scrollbar-thumb:hover{background:rgba(81,224,124,.68)}

/* ---------- output window: terminal green on the same black ---------- */
#out{background:transparent;border:0;color:var(--out);font-family:var(--mono);font-size:12px;line-height:1.65;
white-space:pre-wrap;word-break:break-word;overflow:auto;min-height:120px;max-height:48vh;padding:4px 0 12px;
scrollbar-width:thin;scrollbar-color:rgba(81,224,124,.42) transparent;overscroll-behavior:contain}
#out:empty::before{content:"▍";color:rgba(81,224,124,.5)}
#out::-webkit-scrollbar{width:8px;height:8px}
#out::-webkit-scrollbar-track{background:rgba(7,12,16,.72)}
#out::-webkit-scrollbar-thumb{background:rgba(81,224,124,.34);border:2px solid #0a0f14;border-radius:8px}
#out::-webkit-scrollbar-thumb:hover{background:rgba(81,224,124,.68)}
/* warnings are amber: they are "check this", never "this failed" */
.warn{display:none;margin:0 0 10px;padding:8px 12px;border:1px solid rgba(240,163,92,.34);border-radius:6px;
background:rgba(240,163,92,.07);color:var(--amber);font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.warn.show{display:block}

/* ---------- passengers ---------- */
.paxgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin-bottom:14px}
.field label{display:block;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#7f95a0;font-weight:700;margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .val{min-width:26px;text-align:center;font-size:17px;font-weight:700;color:#e6f3ea}

/* ---------- airline destination ---------- */
.destination-panel{background:rgba(8,13,18,.62);border:1px solid var(--line);border-radius:6px;padding:12px;margin:2px 0 14px}
.destination-panel .sub{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:#7f95a0;font-weight:700;margin-bottom:10px}
.airline-identity{display:flex;align-items:center;gap:11px;min-width:0}
.airline-label{font-size:13px;font-weight:700;color:var(--ink-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.airline-logo{width:30px;height:30px;padding:3px;object-fit:contain;background:#fff;border-radius:4px;flex:none}
.airline-logo-text{display:grid;place-items:center;background:#101920;color:#b9c9d0;border:1px solid #22313c;font-size:11px;font-weight:700}
.airline-single,.airline-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;
background:#070b0f;border:1px solid #22313c;border-radius:6px;color:var(--ink-bright);padding:8px 12px;min-height:50px;font-family:var(--mono)}
.airline-trigger{text-align:left;cursor:pointer}
.airline-trigger:hover{background:#0c1218;border-color:#53d977;filter:none}
.airline-trigger:focus-visible,.airline-option:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.airline-chevron{font-size:20px;color:var(--green);margin-left:12px;line-height:1}
.airline-dropdown{position:relative}
.airline-menu{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:10;max-height:260px;overflow:auto;padding:5px;
background:#0c1218;border:1px solid #22313c;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.6);
scrollbar-width:thin;scrollbar-color:rgba(81,224,124,.42) transparent}
.airline-menu[hidden]{display:none}
.airline-menu::-webkit-scrollbar{width:8px}
.airline-menu::-webkit-scrollbar-track{background:rgba(7,12,16,.72)}
.airline-menu::-webkit-scrollbar-thumb{background:rgba(81,224,124,.34);border:2px solid #0c1218;border-radius:8px}
.airline-option{width:100%;display:block;text-align:left;border:1px solid transparent;border-radius:4px;
background:transparent;color:var(--ink-bright);padding:7px 9px;cursor:pointer;font:inherit;min-height:0}
.airline-option:hover{background:#15231c;border-color:rgba(83,217,119,.4);filter:none}
.airline-option[aria-selected="true"]{background:rgba(31,157,85,.14);border-color:rgba(83,217,119,.5);color:#eaffef}
/* status line: one dot, then the plain truth about the link */
.link-note{color:var(--dim);font-size:11.5px;line-height:1.6;margin:10px 0 0}
.link-note::before{content:"";display:inline-block;width:6px;height:6px;margin:0 8px 1px 1px;border-radius:50%;background:currentColor;vertical-align:middle}
.link-note[data-kind="aa_handoff"]{color:#8ff0aa}
.link-note[data-kind="search_unverified"]{color:var(--amber)}
.link-note[data-kind="homepage"]{color:#8fa6b2}
.link-note[data-kind="unsupported"]{color:#7f95a0}

/* ---------- buttons: flat slabs, one red action, the rest dark ---------- */
button{font-family:var(--mono);cursor:pointer;border:0;border-radius:4px;font-weight:700;font-size:12px;
padding:9px 18px;letter-spacing:.5px;min-height:40px;text-transform:uppercase}
button:hover{filter:brightness(1.14)}
button:focus-visible{outline:2px solid var(--green);outline-offset:3px}
button:disabled{opacity:.42;cursor:not-allowed;filter:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#fff}
.btn.g,.btn.convert{background:var(--red);color:#fff}
.btn.y,.btn.b,.btn.copy{background:#18222b;color:#9fb4bf;border:1px solid #22313c}
.stepper button{width:34px;height:34px;min-height:34px;padding:0;border-radius:4px;border:1px solid #22313c;
background:#18222b;color:#b9c9d0;font-size:16px;line-height:1}
.stepper button:hover{border-color:#53d977;background:#15231c;color:#eaffef;filter:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

/* ---------- status row: byline left, quiet links right ---------- */
.status{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:7px var(--pad-x) 10px;
font-size:10px;letter-spacing:.4px;color:#4d6371;border-top:1px solid var(--line);flex:none}
.credit-credit{margin-right:auto;color:#63788a}
.linkbtn{color:#4d6371;font-size:11px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;
background:none;border:0;padding:0;font-family:var(--mono);font-weight:400;flex:none;white-space:nowrap;
min-height:auto;letter-spacing:0;text-transform:none}
.linkbtn:hover{color:#8fa6b2;filter:none}

/* ---------- dialog: blurred backdrop, hairline card ---------- */
.modal-overlay{position:fixed;inset:0;z-index:51;display:none;align-items:center;justify-content:center;
background:rgba(4,8,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{position:relative;width:400px;max-width:92vw;padding:20px 22px;
background:linear-gradient(180deg,#0d141a,#080c11);border:1px solid #1e2b34;border-radius:12px;
box-shadow:0 30px 90px rgba(0,0,0,.72)}
.modal::before{content:"";position:absolute;inset:0 0 auto;height:2px;border-radius:12px 12px 0 0;opacity:.7;pointer-events:none;
background:linear-gradient(90deg,transparent,rgba(83,217,119,.55) 30%,var(--red) 72%,transparent)}
.modal h2{font-size:11px;color:var(--green);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.modal .m-sub{color:#9db3c0;font-size:12px;margin-bottom:12px}
.modal .m-note{color:var(--dim);font-size:11px;line-height:1.65;margin-bottom:16px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:0}
.ghost{background:#18222b;color:#9fb4bf;border:1px solid #22313c}
.save{background:var(--green2);color:#05230f}

/* ---------- toast: a status flash, not a sliding panel ---------- */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;max-width:calc(100vw - 24px);
background:#0c1218;border:1px solid #22313c;color:var(--ink-bright);font-family:var(--mono);font-size:11.5px;
padding:9px 16px;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}

@media (max-width:840px){.paxgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){

<script>
(function(){
  // Sign-in lasts for as long as this tab is open — there is no idle timeout.
  //  - sessionStorage ('slg_tab') exists only in the tab that signed in. Closing the tab
  //    (or opening a new one) wipes it, so the next visit always needs a fresh OTP login.
  //  - A heartbeat to /api/session keeps the signed cookie alive while the tab is open.
  var HEARTBEAT_MS = 30 * 1000;
  function toLogin(){ try{ sessionStorage.removeItem('slg_tab'); }catch(e){} location.replace('/'); }

  var tab = false;
  try{ tab = sessionStorage.getItem('slg_tab') === '1'; }catch(e){}
  if(!tab){ toLogin(); return; }

  // initial server-side check, then a steady heartbeat. A failed heartbeat (e.g. a brief
  // network drop) is ignored; only a server-confirmed "not signed in" sends the user to login.
  // The first check retries a couple of times for the same reason: a one-second blip must
  // not throw a signed-in user back to the login page (the retries still end at login if
  // the server stays unreachable, so the gate itself is unchanged).
  function firstCheck(tries){
    try{
      fetch('/api/session').then(function(r){ if(!r.ok) toLogin(); }).catch(function(){
        if(tries > 1) setTimeout(function(){ firstCheck(tries - 1); }, 2000);
        else toLogin();
      });
    }catch(e){ toLogin(); } // no fetch at all → fail closed, never show the tool
  }
  firstCheck(3);
  setInterval(function(){
    fetch('/api/session').then(function(r){ if(!r.ok) toLogin(); }).catch(function(){});
  }, HEARTBEAT_MS);
})();
</script>

      tag:(g[0].origin===g[g.length-1].dest)?'ROUND-TRIP':'ONE-WAY'};
  });
  const taxTotals=est.taxes.map((t,ti)=>({tax:{key:'0/'+ti,name:t.name},code:t.code,totalDisplayPrice:'USD'+t.amount.toFixed(2)}));
  const paxObj={adults:Math.max(1,p.adults)}; // BookWithMatrix ITA schema: adults only
  return {ext:{totalPrice:total},
    itinerary:{distance:{units:'MI',value:totalDistance(segs)},slices},
    pricings:[{ext:{pax:paxObj,totalPrice:total},displayPrice:total}],
    tickets:[{pricings:[{ext:{pax:paxObj,taxTotals,totalPrice:total},
      fareCalculations:[{lines:[fareConstruction(segs,est)]}],fares,
      notes:['Synthetic illustration only. Price, fare basis, taxes and fare construction are NOT a real quote; no rules or refund policy verified.'],displayPrice:total}],displayPrice:total}],
    displayTotal:total,id:detId(segs),passengerCount:paxTotal()};
}

/* ================= links ================= */
function unixMs(s){const[y,m,d]=s.ymd.split('-').map(Number);const off=tzOffsetMin(s.origin);
  return Date.UTC(y,m-1,d,s.depH-Math.trunc(off/60),s.depM-(off%60));}
function aaMetaUrl(segs){
  const first=segs[0];const paxStr='A'+pax.adults+'S'+pax.seniors+'C'+pax.children+'I'+pax.infantsInSeat+'Y'+pax.youths+'L'+pax.infantsInLap;
  let legs='';for(const s of segs)legs+='#'+s.origin+'|'+s.dest+'|0|0|'+unixMs(s);
  let flights='';for(let i=0;i<segs.length;i++){const s=segs[i];flights+='#'+s.carrier+'|'+s.num+'|'+(s.cls||'Y')+'|'+s.origin+'|'+s.dest+'|'+unixMs(s)+'|'+i;}
  const parts=['DIRECT','0','US',segs.length===1?'oneWay':'multi','4',paxStr,'0',first.origin,'0',first.dest,
    '0','0','0','0','0','0','0','0.00','1',legs,flights];
  return 'https://www.aa.com/goto/metasearch?ITEN='+encodeURIComponent(parts.join(','));
}
function enc(v){return encodeURIComponent(v);}
function tripType(segs){if(segs.length===1)return 'oneWay';if(segs.length===2&&segs[0].origin===segs[segs.length-1].dest)return 'roundTrip';return 'multiCity';}
function cabin(segs){let best='COACH',p=0;for(const s of segs){const c=cabinForCarrier(s.carrier,s.cls);const q=c==='FIRST'?3:c==='BUSINESS'?2:c==='PREMIUM-COACH'?1:0;if(q>p){p=q;best=c;}}
  return best==='FIRST'?'FIRST':best==='BUSINESS'?'BUSINESS':best==='PREMIUM-COACH'?'PREMIUM_ECONOMY':'COACH';}
function aaUrl(segs){
  const p=['tripType='+tripType(segs),'searchType=Revenue','cabinType='+cabin(segs),'carriers=ALL','adult='+adultEq(),'child='+childEq(),'infantInLap='+pax.infantsInLap];
  segs.forEach((s,i)=>{p.push(enc('slices['+i+'].origin')+'='+enc(s.origin));p.push(enc('slices['+i+'].destination')+'='+enc(s.dest));
    p.push(enc('slices['+i+'].departureDate')+'='+enc(s.ymd));p.push(enc('slices['+i+'].departureTime')+'=ANYTIME');});
  return 'https://www.aa.com/booking/find-flights?'+p.join('&');
}
function unitedUrl(segs){const s0=segs[0];const tt=tripType(segs)==='roundTrip'?2:1;const sc=cabin(segs)==='FIRST'?7:cabin(segs)==='BUSINESS'?4:1;
  let u='https://www.united.com/en/us/fsr/choose-flights?f='+enc(s0.origin)+'&t='+enc(s0.dest)+'&d='+enc(s0.ymd)+'&tt='+tt+'&at='+paxTotal()+'&sc='+sc+'&px='+paxTotal();
  if(tt===2)u+='&r='+enc(segs[1].ymd);return u;}
function deltaUrl(segs){const s0=segs[0];let u='https://www.delta.com/flight-search/book-a-flight?tripType='+(tripType(segs)==='oneWay'?'ONE_WAY':'ROUND_TRIP')+'&originCity='+enc(s0.origin)+'&destinationCity='+enc(s0.dest)+'&departureDate='+enc(s0.ymd)+'&paxCount='+paxTotal();
  if(tripType(segs)==='roundTrip')u+='&returnDate='+enc(segs[1].ymd);return u;}
function gfCabinValue(cabin){
  const value=String(cabin||'COACH').trim().toUpperCase().replace(/[ _]+/g,'-');
  if(value==='FIRST'||value==='F')return 4;
  if(value==='BUSINESS'||value==='C'||value==='J')return 3;
  if(value==='PREMIUM-COACH'||value==='PREMIUM-ECONOMY'||value==='W')return 2;
  return 1;
}
function gfTripTypeValue(segs){
  if(segs.length===1)return 2; // one-way
  if(segs.length===2&&segs[0].origin===segs[1].dest&&segs[0].dest===segs[1].origin)return 1; // round-trip
  return 3; // multi-city
}
function gfUrl(segs,cabin){
  function vi(n){const o=[];while(true){const b=n&0x7f;n>>>=7;if(n)o.push(b|0x80);else{o.push(b);break;}}return o;}
  function fl(num,p){return vi(num<<3|2).concat(vi(p.length),p);}
  function fv(num,v){return vi(num<<3|0).concat(vi(v));}
  const encT=s=>Array.from(new TextEncoder().encode(s));
  let b=fv(1,28).concat(fv(2,2));
  segs.forEach(s=>{const sb=fl(2,encT(s.ymd)).concat(fl(13,fv(1,1).concat(fl(2,encT(s.origin))))).concat(fl(14,fv(1,1).concat(fl(2,encT(s.dest)))));
    b=b.concat(fl(3,sb));});
  b=b.concat(fv(8,1),fv(9,gfCabinValue(cabin)),fv(14,1),[0x82,0x01,0x0b,0x08,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,0x01],fv(19,gfTripTypeValue(segs)));
  const b64=btoa(String.fromCharCode.apply(null,b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'https://www.google.com/travel/flights/search?tfs='+b64+'&hl=en&curr=USD';
}
function itaUrl(segs){
  const slices=segs.map(s=>({origin:[s.origin],dest:[s.dest],dates:{searchDateType:'specific',departureDate:s.ymd}}));
  const obj={type:segs.length>1?'multi-city':'one-way',slices,options:{cabin:'COACH',stops:'0',extraStops:'0',allowAirportChanges:'false',showOnlyAvailable:'false'},pax:{adults:String(pax.adults)}};
  return 'https://matrix.itasoftware.com/search?search='+encodeURIComponent(btoa(JSON.stringify(obj)));
}
/* ================= app ================= */
let pax={adults:1,seniors:0,youths:0,children:0,infantsInSeat:0,infantsInLap:0};
let lastSegs=[],lastJson='',lastSource='',lastInput='';
function ensureCurrentInput(){if(lastInput!==document.getElementById('gds').value)generate();}
function step(key,d){pax[key]=Math.max(0,pax[key]+d);document.getElementById('v-'+key).textContent=pax[key];if(lastSegs.length)generate();}
function paxSeats(){return pax.adults+pax.seniors+pax.youths+pax.children+pax.infantsInSeat;}
function paxTotal(){return paxSeats()+pax.infantsInLap;}
function adultEq(){return pax.adults+pax.seniors+pax.youths;}
function childEq(){return pax.children+pax.infantsInSeat;}
function paxSummary(){const t=[['adults','adult','adults'],['seniors','senior','seniors'],['youths','youth','youths'],['children','child','children'],['infantsInSeat','infant w/ seat','infants w/ seat'],['infantsInLap','infant on lap','infants on lap']];
  const p=t.filter(x=>pax[x[0]]>0).map(x=>pax[x[0]]+' '+(pax[x[0]]===1?x[1]:x[2]));
  return p.length?p.join(' · '):'1 adult';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function generate(){
  const text=document.getElementById('gds').value;
  lastInput=text;
  const out=document.getElementById('out');
  const warnEl=document.getElementById('warn');
  lastSegs=[]; lastJson=''; lastSource='';
  let imported=null;
  if(text.trim().startsWith('{')){
    try { imported=parseMatrixInput(text); lastSegs=imported.segments; lastSource='matrix'; }
    catch(e){
      if(warnEl){warnEl.textContent='⚠ '+e.message;warnEl.classList.add('show');}
      out.textContent='❌ JSON import failed — no legs were silently dropped.';
      renderDestination(); return;
    }
  } else {
    lastSegs=parseSegments(text);
    lastSource='gds';
  }
  if(!lastSegs.length){
    if(warnEl){warnEl.textContent='';warnEl.classList.remove('show');}
    out.textContent='❌ No flight segments recognized — check the GDS text.';
    renderDestination();
    return;
  }
  // never silently drop legs: warn when some segment lines were not recognized
  const unparsed=imported?[]:unparsedLines(text);
  const expected=imported?lastSegs.length:countSegmentLines(text);
  if(warnEl){
    const msgs=[];
    if(unparsed.length)msgs.push('⚠ '+unparsed.length+' line(s) NOT recognized (check format):\n'+unparsed.join('\n'));
    if(expected>lastSegs.length&&!unparsed.length)msgs.push('⚠ Expected '+expected+' segment lines but parsed '+lastSegs.length+' (duplicate legs were merged).');
    const inferredDates=lastSegs.filter(s=>s.dateInferredFrom).map(s=>s.carrier+' '+s.num+': '+s.dateInferredFrom+' → '+s.ymd);
    if(inferredDates.length)msgs.push('⚠ Inferred date(s) to keep the listed flights chronological: '+inferredDates.join(', ')+'. Verify these dates against the original GDS.');
    if(msgs.length){warnEl.textContent=msgs.join('\n');warnEl.classList.add('show');}
    else{warnEl.textContent='';warnEl.classList.remove('show');}
  }
  lastJson=JSON.stringify(imported?imported.original:buildCompleteJson(lastSegs,pax),null,2);
  const lines=[];
  lines.push('Spicy Link Generator · made by Adham Badran');
  lines.push('PARSED '+lastSegs.length+' SEGMENTS · '+paxSummary());
  lines.push(imported?'Imported Matrix JSON: original fare fields preserved on copy; passenger controls do not alter imported JSON.':'GDS text: exported price, fare basis and fare construction are SYNTHETIC, not bookable quotes.');
  lines.push('Selected airline link is labeled by capability. No cart, seat or fare is verified.');
  lines.push('');
  for(const s of lastSegs){
    const op=(s.op && s.op!==s.carrier)?'  op-by '+s.op:'';const mar=s.married?'  MARRIED':'';
    lines.push('  '+ (s.carrier+s.num).padEnd(9)+' '+s.cls+' '+cabinWord(s.cls).padEnd(16)+' '+s.origin+'->'+s.dest+'  '+s.ymd+'  '+pad(s.depH)+':'+pad(s.depM)+' -> '+pad(s.arrH)+':'+pad(s.arrM)+(s.plus?' (+1)':'')+mar+op);
  }
  lines.push('');
  lines.push('CABIN INFERENCE (not verified): '+lastSegs.map(s=>s.carrier+s.num+': '+s.cls+' → '+cabinWord(s.cls)).join('   '));
  out.textContent=lines.join('\n');
  renderDestination();
  toast('Generated '+lastSegs.length+' segments · output ready');
}
async function copyJson(){
  ensureCurrentInput();if(!lastJson)generate();
  if(!lastJson){toast('No valid JSON to copy');return;}
  try{await copyText(lastJson);toast(lastSource==='matrix'?'Original JSON copied':'Synthetic JSON copied — not a live fare');}
  catch(e){toast('Could not copy JSON — check browser clipboard permissions');}
}
// Both actions resolve the same selected carrier and the same handoff.
let selectedCarrier='';
function selectedLinkFor(segments,carrier=selectedCarrier){
  // No BA prefill builder is injected: BA's offer-search handoff is BLOCKED and BA's own
  // search form ignores URL parameters (AA_ACCEPTANCE.md, 2026-10-12), so resolveAirlineLink
  // returns BA's empty multi-city search form plus the itinerary to type in the note.
  return resolveAirlineLink(segments,carrier,pax,{buildAAUrl:aaMetaUrl});
}
function selectedLink(){
  ensureCurrentInput();
  return selectedLinkFor(lastSegs);
}
async function openSelectedLink(){
  const result=selectedLink();

async function copyLink(){

    result.kind==='aa_handoff'?'Same AA metasearch link copied — verify flights and live fare on arrival':

/* BA has no pre-filled handoff (AA_ACCEPTANCE.md, 2026-10-12), so next to BA's own EMPTY
   search form the app offers ONE clearly labeled third-party search: a single Google Flights
   URL covering every collapsed O&D slice, at the itinerary's most common cabin (ties go to the
   higher cabin). Google Flights takes one cabin per search, so mixed cabins cannot be kept leg
   by leg; the note and toast say so, and that it is an unverified search, not a BA booking or fare. */
function cabinLabel(cabin){
  return cabin==='FIRST'?'First':cabin==='BUSINESS'?'Business':cabin==='PREMIUM-COACH'?'Premium economy':'Economy';
}
function alternativeSearch(){
  return gfSearchGroup(lastSegs);
}
async function openAlternativeSearch(){
  ensureCurrentInput();
  const group=alternativeSearch();
  if(!group){toast('No Google Flights search is available for this itinerary');return;}
  const url=gfUrl(group.slices,group.cabin);
  const copied=copyText(url).then(()=>true,()=>false);
  window.open(url,'_blank','noopener,noreferrer');
  const didCopy=await copied;
  const label=cabinLabel(group.cabin);
  const detail=`one ${label} search for every slice; mixed cabins are not kept leg by leg — unverified third-party search, NOT a BA booking or fare`;
  toast(didCopy?`Google Flights opened and copied (${detail})`:`Google Flights opened (${detail})`);
}
function makeAirlineIdentity(option){
  const identity=document.createElement('span');identity.className='airline-identity';
  if(option.logoUrl){
    const img=document.createElement('img');img.className='airline-logo';img.src=option.logoUrl;
    img.alt='';img.width=30;img.height=30;img.loading='lazy';identity.appendChild(img);
  }else{
    const fallback=document.createElement('span');fallback.className='airline-logo airline-logo-text';
    fallback.textContent=option.carrier;identity.appendChild(fallback);
  }
  const label=document.createElement('span');label.className='airline-label';
  label.textContent=option.name+' · '+option.carrier;identity.appendChild(label);
  return identity;
}
function selectCarrier(code){selectedCarrier=code;renderDestination();}
function renderDestination(){
  const picker=document.getElementById('airline-picker'),note=document.getElementById('link-note');
  const generateBtn=document.getElementById('generate-link'),copyBtn=document.getElementById('copy-link');
  const alternatives=document.getElementById('alternative-searches');
  if(!picker||!note||!generateBtn||!copyBtn)return;
  const options=itineraryAirlines(lastSegs);
  if(!options.some(o=>o.carrier===selectedCarrier))selectedCarrier=options[0]?.carrier||'';
  picker.replaceChildren();
  if(!options.length){
    selectedCarrier='';note.textContent='Paste an itinerary to see its airlines.';
    note.dataset.kind='unsupported';generateBtn.disabled=true;copyBtn.disabled=true;
    if(alternatives){alternatives.hidden=true;alternatives.replaceChildren();}
    generateBtn.textContent='Generate airline link';return;
  }
  const selected=options.find(o=>o.carrier===selectedCarrier);
  if(options.length===1){
    const chip=document.createElement('div');chip.className='airline-single';
    chip.appendChild(makeAirlineIdentity(selected));picker.appendChild(chip);
  }else{
    const wrap=document.createElement('div');wrap.className='airline-dropdown';
    const trigger=document.createElement('button');trigger.type='button';trigger.className='airline-trigger';
    trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
    trigger.setAttribute('aria-label','Choose airline for this itinerary');
    trigger.appendChild(makeAirlineIdentity(selected));
    const chevron=document.createElement('span');chevron.className='airline-chevron';chevron.textContent='⌄';trigger.appendChild(chevron);
    const menu=document.createElement('div');menu.className='airline-menu';menu.setAttribute('role','listbox');
    menu.setAttribute('aria-label','Airlines in this itinerary');menu.hidden=true;
    const choices=[];
    const close=(focus=false)=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false');if(focus)trigger.focus();};
    const open=(index=options.findIndex(o=>o.carrier===selectedCarrier))=>{
      menu.hidden=false;trigger.setAttribute('aria-expanded','true');choices[index]?.focus();
    };
    trigger.addEventListener('click',()=>menu.hidden?open():close());
    trigger.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();open(e.key==='ArrowDown'?0:choices.length-1);}
      if(e.key==='Escape')close();
    });
    options.forEach((option,index)=>{
      const choice=document.createElement('button');choice.type='button';choice.className='airline-option';
      choice.setAttribute('role','option');choice.setAttribute('aria-selected',String(option.carrier===selectedCarrier));
      choice.appendChild(makeAirlineIdentity(option));
      choice.addEventListener('click',()=>{selectCarrier(option.carrier);document.querySelector('.airline-trigger')?.focus();});
      choice.addEventListener('keydown',e=>{
        if(e.key==='Escape'){e.preventDefault();close(true);}
        if(e.key==='ArrowDown'||e.key==='ArrowUp'){
          e.preventDefault();choices[(index+(e.key==='ArrowDown'?1:-1)+choices.length)%choices.length].focus();
        }
      });
      choices.push(choice);menu.appendChild(choice);
    });
    wrap.addEventListener('focusout',e=>{if(!wrap.contains(e.relatedTarget))close();});
    wrap.appendChild(trigger);wrap.appendChild(menu);picker.appendChild(wrap);
  }
  const result=selectedLinkFor(lastSegs,selectedCarrier);
  const alternative=result.manualEntry?alternativeSearch():null;
  const alternativeNote=alternative
    ?` Alternative: the button below opens ONE pre-filled Google Flights search covering every O&D slice in ${cabinLabel(alternative.cabin)}, the itinerary’s most common cabin. Google Flights allows one cabin per search, so it cannot preserve mixed-cabin classes leg by leg. It is an unverified third-party search, NOT a BA booking or fare.`
    :'';
  note.textContent=(options.length>1?'Multiple marketing airlines detected. Choose who to visit. ':'')+result.note+alternativeNote;
  note.dataset.kind=result.kind;
  generateBtn.textContent=result.label;generateBtn.disabled=!result.url;copyBtn.disabled=!result.url;
  if(alternatives){
    alternatives.replaceChildren();
    alternatives.hidden=!alternative;
    if(alternative){
      const button=document.createElement('button');
      button.type='button';button.className='btn b';button.dataset.cabin=alternative.cabin;
      button.textContent='Pre-filled Google Flights (not BA)';
      button.setAttribute('aria-label',`Open one pre-filled Google Flights search (${cabinLabel(alternative.cabin)} for every slice), an unverified third-party search, not BA`);
      button.addEventListener('click',()=>openAlternativeSearch());
      alternatives.appendChild(button);
    }
  }
}
async function copyText(text){
  if(typeof navigator!=='undefined' && navigator.clipboard?.writeText){
    try{await navigator.clipboard.writeText(text);return;}catch(e){} // fallback for denied permissions
  }
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();const copied=document.execCommand('copy');ta.remove();
  if(!copied)throw new Error('Clipboard unavailable');
}

/* auto-parse: pasting, editing, or pressing Enter runs generate() (the Generate button is gone) */
(function(){
  const ta=document.getElementById('gds'); if(!ta)return;
  let t=null;
  const autosize=()=>{ta.style.height='auto';ta.style.height=Math.max(56,ta.scrollHeight)+'px';};
  ta.addEventListener('input',()=>{autosize();clearTimeout(t);t=setTimeout(generate,700);});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();clearTimeout(t);autosize();generate();}
  });
  autosize();
})();
