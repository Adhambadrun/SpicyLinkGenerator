name: BA live browser probe

# Manual-only: reproduces the AA_ACCEPTANCE.md "Open BA offer search" browser run
# against ba.com from a normal desktop Chrome under Xvfb. Never triggered by push
# except while the workflow file itself is being iterated on.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ba-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation (not committed)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium || true
      - name: Run probe
        run: |
          mkdir -p artifacts
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
            node tools/ba-live-probe.mjs --capture --matrix --legacy --seconds=150
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ba-probe-artifacts
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14
