<style>
  :root{--bg:#0b0b0d;--card:#16161a;--line:#2a2a2e;--ink:#fafafc;--muted:#a2a2a8;--red:#e00012}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px}
  .panel{width:100%;max-width:430px;background:linear-gradient(135deg,#0b0b0d,#1a0d0d);border:1px solid #3a3a3e;border-left:4px solid var(--red);border-radius:12px;padding:28px 26px 22px}
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}
  .brand img{border-radius:9px;background:#000;display:block}
  .brand h1{margin:0;font-size:17px;font-weight:700}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
  .step{display:none}
  .step.active{display:block}
  .step-tag{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 6px}
  label{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
  input{width:100%;background:#0d0d12;border:1px solid #33333d;border-radius:8px;color:var(--ink);padding:12px 14px;font-size:15px;margin-bottom:12px}
  input:focus{outline:none;border-color:var(--red)}
  input.code{letter-spacing:12px;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700}
  button{width:100%;background:var(--red);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid #33333d;color:var(--muted);font-weight:600;margin-top:8px}
  .msg{margin-top:14px;font-size:12.5px;color:var(--muted);min-height:18px}
  .msg.err{color:#ff8890}
  .msg.ok{color:#7ee2a8}
  .hint{margin-top:10px;font-size:11.5px;color:#55555d}
  .devhint{margin-top:8px;font-size:12px;color:#7ee2a8;display:none}
  .foot{margin-top:22px;text-align:center;color:#55555d;font-size:11.5px}
</style>
</head>
<body>

      <div>
        <h1>Spicy Link Generator</h1>
        <p>Secure sign-in · made by Lamar García</p>
      </div>
    </div>

    <!-- STEP 1 · email -->
    <div class="step active" id="step-email">
      <p class="step-tag">Step 1 · Work email</p>
      <label>Email</label>
      <input id="email" type="email" placeholder="you@bcflights.com" autocomplete="email" autocapitalize="off" spellcheck="false">
      <button id="btn-request">Request code</button>
      <div class="hint">Only @bcflights.com emails are allowed.</div>
    </div>

    <!-- STEP 2 · code -->
    <div class="step" id="step-code">
      <p class="step-tag">Step 2 · Verification code</p>
      <label>6-digit code</label>
      <input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="one-time-code">
      <button id="btn-verify">Verify &amp; enter</button>
      <button class="ghost" id="btn-back">Use a different email</button>
      <div class="devhint" id="devhint"></div>
      <div class="hint">Enter the code your approver sends you. It expires in 10 minutes.</div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="foot">Spicy Link Generator · made by Lamar García</div>
  </div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state = { token: null, email: '' };

  function setMsg(t, kind){ var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }

  $('btn-request').addEventListener('click', async function(){
    var email = $('email').value.trim();
    if(!email){ setMsg('Enter your work email.', 'err'); return; }
    this.disabled = true;
    setMsg('Requesting code…');
    try{
      var r = await fetch('/api/request-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      var j = await r.json();
      if(!r.ok){ setMsg(j.error || 'Something went wrong.', 'err'); return; }
      state = { token: j.token, email: email };
      $('step-email').classList.remove('active');
      $('step-code').classList.add('active');
      if(j.devCode){ $('devhint').style.display = 'block'; $('devhint').textContent = 'Test code: ' + j.devCode; }
      setMsg(j.message || 'Enter the code sent to the approver.', 'ok');
      setTimeout(function(){ $('code').focus(); }, 60);
    }catch(e){ setMsg('Network error — try again.', 'err'); }
    finally{ this.disabled = false; }
  });

  $('btn-verify').addEventListener('click', async function(){
    var code = $('code').value.trim();
    if(code.length !== 6){ setMsg('Enter the 6-digit code.', 'err'); return; }
    this.disabled = true;
    setMsg('Verifying…');
    try{
      var r = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: state.token, code: code, email: state.email })
      });
      var j = await r.json();
      if(j.token) state.token = j.token;
      if(!r.ok){ setMsg(j.error || 'Wrong code.', 'err'); return; }
      setMsg('Verified — opening the app…', 'ok');
      location.href = '/app.html';
    }catch(e){ setMsg('Network error — try again.', 'err'); }
    finally{ this.disabled = false; }
  });

  $('btn-back').addEventListener('click', function(){
    $('step-code').classList.remove('active');
    $('step-email').classList.add('active');
    $('code').value = '';
    setMsg('');
  });

  $('code').addEventListener('input', function(){ this.value = this.value.replace(/\D/g, '').slice(0, 6); });
  $('code').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('btn-verify').click(); });
  $('email').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('btn-request').click(); });

  // already signed in? skip straight to the app
  (async function(){
    try{ var r = await fetch('/api/session'); if(r.ok) location.replace('/app.html'); }catch(e){}
  })();
})();
</script>
